services:

  # ── Flask API backend ──────────────────────────────────────────────────────
  - type: web
    name: fastwork-scraper-api
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: WEB_CONCURRENCY
        value: "1"

  # ── React SPA frontend ────────────────────────────────────────────────────
  - type: web
    name: fastwork-scraper-web
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      # Render injects the backend's hostname (e.g. fastwork-scraper-api.onrender.com)
      # into this build-time variable so the frontend bundle points at the right URL.
      - key: VITE_API_URL
        fromService:
          name: fastwork-scraper-api
          type: web
          property: host
